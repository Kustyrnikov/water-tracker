<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Трекер воды</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>💧 Трекер воды</h1>

  <div>
    <input type="number" id="goalInput" placeholder="Дневная цель (мл)" min="0">
    <button id="setGoalBtn">Установить цель</button>
    <p>Цель: <span id="goalDisplay">-</span> мл</p>
  </div>


  <div>
    <input type="number" id="waterAmount" placeholder="мл" min="0">
    <button id="addBtn">Добавить</button>
  </div>


  <h2>История</h2>
  <ul id="historyList"></ul>
  <p>Всего сегодня: <span id="totalDisplay">0</span> мл</p>

  <script src="app.js"></script>
</body>
</html>
